[package]
name = "pi-piper"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Remote control bridge for the pi coding agent, reachable over Tailscale from a phone."
license = "MIT"
repository = "https://github.com/ritvijsrivastava/pi-piper"
readme = "README.md"
keywords = ["pi", "coding-agent", "tailscale", "remote-control", "pwa"]
categories = ["command-line-utilities", "web-programming::http-server"]
exclude = [".github", "deploy", "scripts", "tests", "pi-piper-agent"]

# Let `cargo binstall pi-piper` fetch the prebuilt release tarball instead of
# compiling: matches the artifacts produced by .github/workflows/release.yml
# (each tarball contains a top-level `pi-piper-<target>/pi-piper` binary).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/pi-piper-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "pi-piper-{ target }/{ bin }{ binary-ext }"

[dependencies]
# Async runtime: process spawning, IO, sync primitives, timers, signal handling.
tokio = { version = "1.53", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "net",
    "sync",
    "fs",
    "time",
    "signal",
] }

# HTTP + WebSocket server.
axum = { version = "0.8", features = ["ws"] }

# Stream/Sink combinators needed to split and drive the axum WebSocket.
futures-util = "0.3"

# JSON (de)serialization for the RPC protocol and the browser-facing protocol.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Structured logging.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Embed the PWA static assets directly into the compiled binary.
rust-embed = "8"
mime_guess = "2"

# CLI argument / environment variable parsing.
clap = { version = "4", features = ["derive", "env"] }

# Error handling.
anyhow = "1"
thiserror = "2"

# Session ids (registry keys) and agent-command envelope ids.
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# Only used by integration tests to act as a WebSocket client against the
# real server.
tokio-tungstenite = "0.29"
# Only used by integration tests to act as a plain HTTP client against
# `/api/sessions`.
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[profile.release]
# Single long-running binary: prefer smaller, slightly slower code over
# maximal runtime speed for a service that is mostly I/O bound.
opt-level = "s"
lto = true
