<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>Piper</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header id="status-bar">
      <span id="status-dot" class="dot dot-disconnected"></span>
      <span id="status-text">Connecting&hellip;</span>
      <button id="settings-toggle" type="button" aria-label="Settings">&#9881;</button>
    </header>

    <section id="settings" hidden>
      <label for="token-input">Access token</label>
      <input id="token-input" type="password" autocomplete="off" placeholder="Shared token" />
      <button id="settings-save" type="button">Save &amp; connect</button>
      <p class="hint">
        The token is the shared secret configured on the Piper server
        (<code>--token</code> / <code>PIPER_TOKEN</code>). It is stored only
        in this browser's local storage.
      </p>
    </section>

    <main id="transcript" aria-live="polite"></main>

    <footer id="composer">
      <textarea
        id="message-input"
        rows="1"
        placeholder="Message pi&hellip;"
        aria-label="Message"
      ></textarea>
      <div id="composer-actions">
        <button id="abort-button" type="button" hidden>Abort</button>
        <button id="send-button" type="button">Send</button>
      </div>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
